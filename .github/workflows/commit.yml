name: Commit Message Check

on:
  pull_request:
    branches: ["master"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commit-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-commits:
    name: Validate commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check commit message format
        uses: actions/github-script@v9
        with:
          script: |
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100
              }
            );

            if (context.payload.pull_request.commits > 250) {
              core.setFailed(
                "This check supports up to 250 commits per pull request. Split this pull request."
              );
              return;
            }

            const pattern =
              /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)\([a-z0-9][a-z0-9/-]*\)!?: \S.*$/;

            let invalidCount = 0;

            for (const commit of commits) {
              const subject = commit.commit.message.split(/\r?\n/)[0];
              const sha = commit.sha.substring(0, 7);

              // Skip actual merge commits.
              if (commit.parents.length > 1) {
                core.info(`Skipped merge commit: ${sha}`);
                continue;
              }

              if (!pattern.test(subject)) {
                invalidCount++;
                core.error(
                  `${sha}: "${subject}"\n` +
                  "Required format: type(scope): description\n" +
                  "Example: feat(account): add login endpoint"
                );
              } else {
                core.info(`Valid: ${sha} ${subject}`);
              }
            }

            if (invalidCount > 0) {
              core.setFailed(
                `${invalidCount} commit message(s) have an invalid format.`
              );
            } else {
              core.info("All commit messages passed.");
            }
