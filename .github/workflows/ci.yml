name: Verify application
on:
  push:
    branches: [master, fixing, database, frontend, spring-ai]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        java: ["17", "21"]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_DATABASE: Bayt_v2_test
          MYSQL_USER: bayt
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DB_URL: jdbc:mysql://localhost:3306/Bayt_v2_test?connectionTimeZone=UTC
      TEST_DB_USER: bayt
      TEST_DB_PASSWORD: test-only-password
      COOKIE_SECURE: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
      - name: Verify application restart preserves migrated data
        env:
          DB_URL: jdbc:mysql://localhost:3306/Bayt_v2_test?connectionTimeZone=UTC
          DB_USER: bayt
          DB_PASSWORD: test-only-password
          MYSQL_PWD: test-only-password
        run: |
          before=$(mysql -h 127.0.0.1 -u bayt -N -e "SELECT COUNT(*) FROM Bayt_v2_test.user_account")
          test "$before" -gt 0
          for cycle in 1 2; do
            java -jar target/Bayt-1.0.0-SNAPSHOT.jar > "startup-$cycle.log" 2>&1 &
            app_pid=$!
            trap 'kill "$app_pid" 2>/dev/null || true' EXIT
            ready=false
            for attempt in $(seq 1 60); do
              if curl -fsS http://localhost:8080/api/health; then ready=true; break; fi
              sleep 2
            done
            test "$ready" = true || { cat "startup-$cycle.log"; exit 1; }
            after=$(mysql -h 127.0.0.1 -u bayt -N -e "SELECT COUNT(*) FROM Bayt_v2_test.user_account")
            test "$before" = "$after"
            kill "$app_pid"
            wait "$app_pid" || true
            trap - EXIT
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-java-${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
