name: Verify application
on:
  push:
    branches: [master, fixing, database, frontend, spring-ai]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        java: ["17", "21"]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_DATABASE: Bayt_v2_test
          MYSQL_USER: bayt
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DB_URL: jdbc:mysql://localhost:3306/Bayt_v2_test?connectionTimeZone=UTC
      TEST_DB_USER: bayt
      TEST_DB_PASSWORD: test-only-password
      COOKIE_SECURE: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-java-${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
