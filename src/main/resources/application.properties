spring.application.name=Bayt
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/Bayt_v2?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:bayt}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
app.storage=${STORAGE_PATH:./storage}
app.upload-scan-command=${UPLOAD_SCAN_COMMAND:}
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
app.ai.enabled=${AI_ENABLED:false}
app.ai.key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gpt-4.1-mini}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:12}
