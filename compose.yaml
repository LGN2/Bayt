services:
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: Bayt_v2
      MYSQL_USER: ${DB_USER:-bayt}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports: ["127.0.0.1:${DB_PORT:-3307}:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-bayt}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      UPLOAD_SCAN_COMMAND: ${UPLOAD_SCAN_COMMAND:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-12}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
    volumes: ["protected-files:/data"]
volumes:
  mysql-data:
  protected-files:
